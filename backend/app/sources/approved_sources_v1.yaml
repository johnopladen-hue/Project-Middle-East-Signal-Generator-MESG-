# MESG — Approved source set v1 (Owner-approved 2026-09-27; see D-021)
#
# Every URL/handle below was verified live on 2026-09-27 through a summarising
# fetch tool (not raw HTTP) - see MESG-candidate-sources-2026-09-27.md.
# The collectors MUST re-verify each one from the Owner's machine with a real
# parser (Ingestion Orders O-5/O-6) and record per-source results in findings.md.
#
# Field mapping -> backend/app/models.py Source:
#   key               stable seed identifier (upsert key; not a model column unless Code adds one)
#   name, url, language, dialect, region  -> same-named columns
#   kind              rss | telegram
#   source_class      native | pre_translated | english_comparison
#   pair_id           same-outlet (or same-group) bilingual pairs share it
#   translator_selector  who selects/renders the text when it isn't the original voice
#   designation_note  US designation/sanction or faction affiliation, as recorded (D-018)
#   verification_note NEW column (Approved-Sources orders S-2): authenticity/lag caveats
#   type              legacy column: rss -> "rss", telegram -> "discussion"
# credibility_prior is deliberately NOT set: it stays at the model default until
# the analysis order assesses sources on evidence, not on this list's labels.

